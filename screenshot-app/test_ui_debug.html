<!DOCTYPE html>
<html>
<head>
    <title>UI Debug Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .config-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .config-item:last-child {
            border-bottom: none;
        }
        .config-text {
            flex: 1;
            font-size: 14px;
        }
        .url {
            color: #333;
            font-weight: 500;
        }
        .separator {
            margin: 0 8px;
            color: #999;
        }
        .actions {
            color: #666;
        }
        .buttons {
            display: flex;
            gap: 8px;
        }
        button {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: white;
        }
        .edit-btn {
            background-color: #2196F3;
        }
        .delete-btn {
            background-color: #f44336;
        }
    </style>
</head>
<body>
    <h1>🔍 UI Debug Test</h1>
    
    <div class="test-section">
        <h2>Expected UI Format:</h2>
        <p><code>URL: text1, text2, text3 [Edit] [Delete]</code></p>
    </div>

    <div class="test-section">
        <h2>Test Data from Backend:</h2>
        <div id="backend-data"></div>
    </div>

    <div class="test-section">
        <h2>Rendered UI:</h2>
        <div id="rendered-ui"></div>
    </div>

    <script>
        // Fetch from backend
        fetch('http://localhost:8000/api/url-configs')
            .then(res => res.json())
            .then(data => {
                // Show raw data
                document.getElementById('backend-data').innerHTML = 
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';

                // Render UI
                const configs = data.url_patterns || [];
                const html = configs.map(config => `
                    <div class="config-item">
                        <div class="config-text">
                            <span class="url">${config.url_pattern}</span>
                            <span class="separator">:</span>
                            <span class="actions">${config.actions.map(a => a.text).join(', ')}</span>
                        </div>
                        <div class="buttons">
                            <button class="edit-btn">✏️ Edit</button>
                            <button class="delete-btn">🗑️ Delete</button>
                        </div>
                    </div>
                `).join('');

                document.getElementById('rendered-ui').innerHTML = html || 
                    '<p style="color: #999;">No configurations found</p>';
            })
            .catch(err => {
                document.getElementById('backend-data').innerHTML = 
                    '<p style="color: red;">Error: ' + err.message + '</p>';
                document.getElementById('rendered-ui').innerHTML = 
                    '<p style="color: red;">Failed to load configurations</p>';
            });
    </script>
</body>
</html>
